name: Deploy Kayak 10.9 Monograph to GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download rendered plates, studio views, GLB models & static 3D viewer from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site
          if gh release view --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download --repo "${{ github.repository }}" --pattern "kayak-10-9-site-assets.tar.gz" --dir /tmp
            tar -xzf /tmp/kayak-10-9-site-assets.tar.gz -C _site
          else
            echo "::warning::No GitHub release published yet; building HTML shell before release upload."
          fi

      - name: Render index.html & copy local JSON/CSV/SVG/hull datasets
        run: python3 site/build_site.py --dist _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
